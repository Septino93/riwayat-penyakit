<!doctype html>
<!DOCTYPE html>

<!DOCTYPE html>

<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Admin Portal - Kuisioner Riwayat Penyakit</title>
<link href="assets/css/styles.css" rel="stylesheet"/>
</head>
<body class="admin-page">
<main class="admin-shell">
<section class="login-card admin-login-card" id="loginPanel">
<div class="admin-brand-mark">FRP</div>
<p class="eyebrow">ADMIN PORTAL</p>
<h1>Login Admin</h1>
<p class="muted">Kelola pengajuan Kuisioner Riwayat Penyakit.</p>
<label>Username
        <input autocomplete="username" id="adminUsername" placeholder="Masukkan username"/>
</label>
<label>Password
        <input autocomplete="current-password" id="adminPassword" placeholder="Masukkan password" type="password"/>
</label>
<button class="btn primary full" id="loginBtn">Masuk</button>
<div class="error-box" hidden="" id="loginError"></div>
</section>
<section hidden="" id="dashboardPanel">
<header class="admin-header">
<div class="admin-heading">
<div class="admin-brand-mark small-mark">FRP</div>
<div>
<p class="eyebrow">ADMIN DASHBOARD</p>
<h1>Form Riwayat Penyakit</h1>

</div>
</div>
<div class="admin-actions"><button class="btn secondary" id="refreshBtn">Refresh</button><button class="btn danger-soft" id="logoutBtn">Keluar</button></div>
</header>
<section class="admin-workspace">
<div class="toolbar admin-toolbar simple-toolbar"><div class="search-box">
<span class="search-icon">⌕</span>
<input id="searchInput" placeholder="Cari nama, HP, email, atau nomor registrasi"/>
</div></div>
<div class="table-wrap admin-table-wrap">
<table class="compact-table admin-table">
<thead>
<tr><th>Registrasi</th><th>Tanggal</th><th>Nasabah</th><th>Kontak</th><th>Aksi</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<div class="empty admin-empty" hidden="" id="emptyState">
<div class="empty-icon">⌕</div>
<strong>Data tidak ditemukan</strong>
<span>Coba ubah kata pencarian atau filter.</span>
</div>
<div class="error-box" hidden="" id="dashboardError"></div>
</section>
</section>
</main>
<dialog class="detail-dialog admin-detail-dialog" id="detailDialog">
<div class="dialog-head admin-dialog-head">
<div>
<p class="eyebrow">INFORMASI RIWAYAT PENYAKIT</p>
<h2 id="detailTitle">Detail Nasabah</h2>
<p class="detail-meta" id="detailMeta"></p>
</div>
<button aria-label="Tutup" class="icon-close" id="closeDialog">×</button>
</div>
<div class="detail-navigation-bar"><div class="detail-tabs detail-tabs-inline">
<button class="detail-tab active" data-tab="profile">Data Nasabah</button>
<button class="detail-tab" data-tab="answers">Kuisioner</button>
<button class="detail-tab" data-tab="documents">Dokumen</button>
</div><div class="detail-action-buttons detail-actions-inline"><button class="btn secondary" id="exportPdfBtn"><span class="action-icon">↓</span><span>PDF</span></button><button class="btn folder-btn" id="openFolderBtn"><span class="action-icon">▣</span><span>Folder</span></button><button class="btn whatsapp-btn" id="whatsappBtn"><span class="action-icon">◉</span><span>WA</span></button><button class="btn delete-btn" id="deleteDataBtn"><span class="action-icon">×</span><span>Hapus</span></button></div></div>

<div class="detail-tab-panel active" id="tab-profile">
<div class="detail-grid" id="profileContent"></div>
</div>
<div class="detail-tab-panel" id="tab-answers">
<div class="detail-grid" id="answerContent"></div>
</div>
<div class="detail-tab-panel" id="tab-documents">
<div class="document-grid" id="documentContent"></div>
</div>
</dialog>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
